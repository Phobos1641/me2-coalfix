# Meson cross file: 32-bit Linux on a multilib x86_64 host, fully static.
#   meson setup build --cross-file ci/linux-i686.ini
#
# -m32 is part of the compiler command itself so it applies to compiling,
# linking and Meson's own sanity checks, and host_machine reports x86.

[binaries]
c = ['gcc', '-m32']
cpp = ['g++', '-m32']
ar = 'ar'
strip = 'strip'
pkg-config = 'pkg-config'

[properties]
pkg_config_libdir = ['/usr/lib32/pkgconfig']

[built-in options]
cpp_link_args = ['-static']

[host_machine]
system = 'linux'
cpu_family = 'x86'
cpu = 'i686'
endian = 'little'
