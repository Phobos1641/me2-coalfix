# Meson cross file: Windows x86_64 via MinGW-w64.
#   meson setup build --cross-file ci/windows-x86_64.ini

[constants]
triple = 'x86_64-w64-mingw32'

[binaries]
c = triple + '-gcc'
cpp = triple + '-g++'
ar = triple + '-ar'
strip = triple + '-strip'
windres = triple + '-windres'
pkg-config = 'pkg-config'

[properties]
pkg_config_libdir = ['/usr/' + triple + '/lib/pkgconfig']
needs_exe_wrapper = true

[built-in options]
# -static already implies -static-libgcc and -static-libstdc++, and also pulls
# in winpthreads statically, so the .exe needs no MinGW DLLs next to it.
cpp_link_args = ['-static', '-lstdc++exp']

[host_machine]
system = 'windows'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'
