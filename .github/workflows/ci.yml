name: Build & Release

on:
  push: # All branches and tags
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs on the same branch/PR, but never a tag's release run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  BUILD_TYPE: debugoptimized

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ubuntu-latest
    # Same image as the GitLab pipeline, so both use the same GCC/MinGW versions.
    container: archlinux:multilib-devel
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            machine-file: --native-file .ci/linux-x86_64.ini
          - platform: linux-i686
            machine-file: --cross-file .ci/linux-i686.ini
          - platform: windows-x86_64
            machine-file: --cross-file .ci/windows-x86_64.ini
            packages: mingw-w64
          - platform: windows-i686
            machine-file: --cross-file .ci/windows-i686.ini
            packages: mingw-w64
    defaults:
      run:
        shell: bash
    env:
      PLATFORM: ${{ matrix.platform }}
    steps:
      # git must exist before checkout, otherwise it falls back to a tarball download.
      - name: Install toolchain
        run: pacman -Syyu --noconfirm --needed git meson jq zip ${{ matrix.packages }}

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Configure
        run: meson setup build --buildtype="$BUILD_TYPE" ${{ matrix.machine-file }}

      - name: Compile
        run: meson compile -C build

      - name: Test
        if: matrix.test
        run: meson test -C build --print-errorlogs

      # Zipped here rather than in the release job because upload-artifact
      # drops Unix permissions, which would strip +x from the Linux binaries.
      - name: Package
        id: package
        run: |
          bash .ci/package.sh build "$PLATFORM"
          name=$(meson introspect build --projectinfo | jq -r .descriptive_name)
          zip="$name-$PLATFORM.zip"
          (cd "dist/$PLATFORM" && zip -9 -r "../../$zip" .)
          echo "zip=$zip" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.platform }}
          path: ${{ steps.package.outputs.zip }}
          compression-level: 0      # already a zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      # Created as a draft and published only after the zips are attached, so
      # nobody sees an empty release. Safe to re-run: existing assets are replaced.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -l dist
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --draft --verify-tag --title "$TAG" --generate-notes
          fi
          gh release upload "$TAG" dist/*.zip --clobber
          gh release edit "$TAG" --draft=false
