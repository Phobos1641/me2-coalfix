image: archlinux:multilib-devel

stages:
  - build
  - release

variables:
  BUILD_TYPE: debugoptimized

# ---------------------------------------------------------------------------
# Build
#
# Per-platform compiler/linker settings live in ci/*.ini (Meson machine files)
# so this file, the GitHub workflow and local builds all share them.
# `extends` deep-merges, so jobs only override the variables that differ.
# ---------------------------------------------------------------------------
.build:
  stage: build
  tags:
    - gitgud
  variables:
    PACKAGES: ""          # extra pacman packages for this platform
    RUN_TESTS: "false"
  before_script:
    - pacman -Syu --noconfirm --needed meson jq $PACKAGES
  script:
    - meson setup build --buildtype="$BUILD_TYPE" $MACHINE_FILE
    - meson compile -C build
    - if [ "$RUN_TESTS" = true ]; then meson test -C build --print-errorlogs; fi
    - bash .ci/package.sh build "$PLATFORM"
  artifacts:
    name: "$CI_PROJECT_NAME-$PLATFORM"
    paths:
      - dist/
    expire_in: 1 week

build:linux-x86_64:
  extends: .build
  variables:
    PLATFORM: linux-x86_64
    MACHINE_FILE: --native-file .ci/linux-x86_64.ini

build:linux-i686:
  extends: .build
  variables:
    PLATFORM: linux-i686
    MACHINE_FILE: --cross-file .ci/linux-i686.ini

build:windows-x86_64:
  extends: .build
  variables:
    PLATFORM: windows-x86_64
    MACHINE_FILE: --cross-file .ci/windows-x86_64.ini
    PACKAGES: mingw-w64

build:windows-i686:
  extends: .build
  variables:
    PLATFORM: windows-i686
    MACHINE_FILE: --cross-file .ci/windows-i686.ini
    PACKAGES: mingw-w64

# ---------------------------------------------------------------------------
# Release (tags only)
#
# Every file in dist/<platform>/ is uploaded and linked on the release as
# "<platform>: <file>". Safe to retry: an existing release is reused and
# links that already exist are skipped.
# ---------------------------------------------------------------------------
release:
  stage: release
  image: debian:stable-slim
  tags:
    - gitgud
  rules:
    - if: $CI_COMMIT_TAG
  needs:
    - build:linux-x86_64
    - build:linux-i686
    - build:windows-x86_64
    - build:windows-i686
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq --no-install-recommends curl ca-certificates jq
  script:
    - |
      set -euo pipefail
      shopt -s nullglob

      api="$CI_API_V4_URL/projects/$CI_PROJECT_ID"
      tag="$CI_COMMIT_TAG"
      tag_enc=$(jq -rn --arg t "$tag" '$t | @uri')

      # curl wrapper: fails on HTTP errors and prints GitLab's error message.
      gl() {
        local out
        if ! out=$(curl --silent --show-error --fail-with-body \
            --header "Authorization: Bearer $RELEASE_API_TOKEN" "$@"); then
          printf '%s\n' "$out" >&2
          return 1
        fi
        printf '%s\n' "$out"
      }

      platforms=(dist/*/)
      if [ ${#platforms[@]} -eq 0 ]; then
        echo "No build artifacts found in dist/" >&2
        exit 1
      fi

      if gl --output /dev/null "$api/releases/$tag_enc" 2>/dev/null; then
        echo "Release $tag already exists, reusing it"
      else
        echo "Creating release $tag"
        gl --request POST --header "Content-Type: application/json" \
          --data "$(jq -n --arg t "$tag" '{name: $t, tag_name: $t}')" \
          "$api/releases" >/dev/null
      fi

      existing=$(gl "$api/releases/$tag_enc/assets/links" | jq -r '.[].name')

      for dir in "${platforms[@]}"; do
        platform=$(basename "$dir")
        for file in "$dir"*; do
          link_name="$platform: $(basename "$file")"

          if grep -qxF -- "$link_name" <<<"$existing"; then
            echo "Skipping '$link_name' (already on release)"
            continue
          fi

          echo "Uploading $file"
          full_path=$(gl --form "file=@$file" "$api/uploads" | jq -er '.full_path')
          url="$CI_SERVER_URL$full_path"

          gl --request POST --header "Content-Type: application/json" \
            --data "$(jq -n --arg n "$link_name" --arg u "$url" '{name: $n, url: $u}')" \
            "$api/releases/$tag_enc/assets/links" >/dev/null

          echo "Linked '$link_name' -> $url"
        done
      done
